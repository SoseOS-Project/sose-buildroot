# addresses for the vms behind sys-net, started by S45netvm
interface  vmbr0
start      10.137.0.10
end        10.137.0.250
lease_file /var/lib/misc/udhcpd.leases

option subnet 255.255.255.0
option router 10.137.0.1
# qemu's dns server, reached through the nat. changes on real hardware
option dns    10.0.2.3
