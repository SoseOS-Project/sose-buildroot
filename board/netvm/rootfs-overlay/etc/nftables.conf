# sys-net's firewall, loaded by S45netvm

flush ruleset

table ip sose {
	# traffic passing through sys-net. only vms going out to the internet,
	# and the replies to that. nothing comes in from outside on its own
	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		iifname "vmbr0" oifname "eth0" accept
	}

	# vms' traffic leaves with sys-net's address, so the outside never sees 10.137.0.x
	chain postrouting {
		type nat hook postrouting priority srcnat;
		oifname "eth0" masquerade
	}
}
