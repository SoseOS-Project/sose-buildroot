# test vm, boots dom0's kernel with the small guest image as its whole filesystem.
# sose.name sets its hostname/prompt. `xl console test` to log in, ctrl+] to get back
name    = "test"
kernel  = "/boot/Image"
ramdisk = "/boot/guest.cpio.gz"
memory  = 128
vcpus   = 1
extra   = "console=hvc0 sose.name=test"
