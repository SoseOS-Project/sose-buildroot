# sys-net, the only vm with the real network. plugged into dom0's br0 (S45bridge),
# gets its address from qemu's network over dhcp. dom0 itself stays offline.
# boots the netvm image (xen tools, nat, dhcp server) instead of the plain guest one,
# and is a driver domain: other vms' network cards are served from in here
name          = "sys-net"
kernel        = "/boot/Image"
ramdisk       = "/boot/netvm.cpio.gz"
memory        = 256
vcpus         = 1
extra         = "console=hvc0 sose.name=sys-net"
vif           = [ 'bridge=br0' ]
driver_domain = 1
