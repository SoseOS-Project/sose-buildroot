# sys-net, the only vm with the real network. plugged into dom0's br0 (S45bridge),
# gets its address from qemu's network over dhcp. dom0 itself stays offline
name    = "sys-net"
kernel  = "/boot/Image"
ramdisk = "/boot/guest.cpio.gz"
memory  = 128
vcpus   = 1
extra   = "console=hvc0 sose.name=sys-net"
vif     = [ 'bridge=br0' ]
